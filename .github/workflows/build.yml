name: Buduj aplikacje

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe / .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Ikony aplikacji
        run: npx --yes @tauri-apps/cli@2.12.3 icon app/icons/icon-1024.png --output src-tauri/icons
      - name: Budowanie instalatora
        run: npx --yes @tauri-apps/cli@2.12.3 build
      - name: Zbierz instalatory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | Copy-Item -Destination out
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Roj-Czasteczek-Windows
          path: out/*
      - name: Wydanie (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Rój Cząsteczek — wersja ${{ github.run_number }}
          body: |
            Instalator dla Windows 10/11. Pobierz plik `*-setup.exe` (zalecany) albo `*.msi` i uruchom.
            Aplikacja działa offline; Doradca AI potrzebuje internetu i klucza API (zakładka Doradca AI).
          files: out/*

  web:
    name: iPhone / przeglądarka (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
